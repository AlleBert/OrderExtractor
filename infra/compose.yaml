services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: order
      POSTGRES_DB: order
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "order", "-d", "order"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      OE_DATABASE: ${OE_DATABASE:?}
      OE_SIGNING_KEY: /run/secrets/license-signing.pem
      OE_PEPPER: ${OE_PEPPER:?}
      OE_OIDC_ISSUER: ${OE_OIDC_ISSUER:?}
      OE_OIDC_AUDIENCE: ${OE_OIDC_AUDIENCE:?}
      OE_OIDC_JWKS: ${OE_OIDC_JWKS:?}
    secrets:
      - source: lease_key
        target: license-signing.pem
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/ready')"]
      interval: 15s
      timeout: 4s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine
    environment:
      OE_HOSTNAME: ${OE_HOSTNAME:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
secrets:
  lease_key:
    file: ${OE_HOST_KEY_FILE:?}
volumes:
  postgres-data:
  caddy-data:
